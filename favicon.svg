    <text font-family="Noto Sans KR, Malgun Gothic, sans-serif" font-size="29" font-weight="750" text-anchor="middle" textLength="357" lengthAdjust="spacingAndGlyphs"><textPath href="#bottom" startOffset="50%">K프랜차이즈CEO교육과정</textPath></text>
    <circle cx="32" cy="180" r="6"/>
    <circle cx="328" cy="180" r="6"/>
    <text x="180" y="200" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-weight="900" font-size="58" textLength="195" lengthAdjust="spacingAndGlyphs">KFCEO</text>
  </g>
