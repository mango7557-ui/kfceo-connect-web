  <circle cx="180" cy="180" r="176" fill="#fff" stroke="#45568f" stroke-width="3"/>
  <circle cx="180" cy="180" r="114" fill="none" stroke="#45568f" stroke-width="3"/>
  <g fill="#45568f">
